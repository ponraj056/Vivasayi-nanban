version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vivasayi_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: vivasayi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vivasayi"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: vivasayi_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:root@db:5432/vivasayi?schema=public
      - JWT_SECRET=vivasayi_nanban_secret_key_2025
      - JWT_EXPIRE=7d
      - META_API_TOKEN=fake_token
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
    container_name: vivasayi_ml
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: vivasayi_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
