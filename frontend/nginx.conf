server {
    listen 80;
    
    # Root directory where the static files will be served
    root /usr/share/nginx/html;
    index index.html;

    # This routes all 404s back to index.html to support React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets like JS and CSS for performance
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
